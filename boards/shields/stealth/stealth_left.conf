# ZMK Studio support (central/left side only) - lets you remap the layout
# on the fly over USB, without reflashing. Connect over USB and open
# https://zmk.studio (or the desktop app) while the keyboard is plugged in.
CONFIG_ZMK_STUDIO=y

# Studio also works over BLE automatically once BLE output is enabled, but
# this keeps a reliable USB serial (CDC-ACM) transport available too.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# This is a personal keyboard with no untrusted parties nearby, so skip the
# "studio unlock" key-combo requirement. Re-enable (set to y) and add a
# &studio_unlock behavior to the keymap if you want to require confirmation
# before Studio can push keymap changes.
CONFIG_ZMK_STUDIO_LOCKING=n